<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توجيهي بلس - فلسطين</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

    <!-- شاشة الهيدر -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-amber-500/20 p-4 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto max-w-2xl flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-gradient-to-tr from-amber-500 to-amber-400 text-slate-950 font-black p-2.5 rounded-2xl text-lg shadow-md shadow-amber-500/20">🇹🇼</div>
                <div>
                    <h1 class="font-black text-lg text-amber-400 tracking-wide">توجيهي بلس</h1>
                    <p class="text-[11px] text-slate-400">بنك أسئلة الوزارة الرسمي</p>
                </div>
            </div>
            <button onclick="openVipModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow-lg shadow-amber-500/10 transition-all transform active:scale-95">
                ⭐ تفعيل الباقة VIP
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto p-4 flex-grow max-w-2xl">
        
        <!-- قسم اختيار المواد -->
        <section id="subjects-section" class="mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold text-slate-200 border-r-4 border-amber-500 pr-3">اختر المادة الدراسية:</h2>
                <span class="text-xs bg-slate-900 border border-slate-800 text-amber-400 px-3 py-1 rounded-full">الفرعين العلمي والأدبي</span>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loadSubject('physics', 'الفيزياء (علمي)')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition-all group shadow-sm">
                    <span class="text-2xl block mb-2 group-hover:scale-110 transition-transform">⚡</span>
                    <span class="font-bold text-amber-400 block text-sm">الفيزياء</span>
                    <span class="text-[11px] text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('math_sci', 'الرياضيات (علمي)')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition-all group shadow-sm">
                    <span class="text-2xl block mb-2 group-hover:scale-110 transition-transform">📐</span>
                    <span class="font-bold text-amber-400 block text-sm">الرياضيات</span>
                    <span class="text-[11px] text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('chemistry', 'الكيمياء (علمي)')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition-all group shadow-sm">
                    <span class="text-2xl block mb-2 group-hover:scale-110 transition-transform">🧪</span>
                    <span class="font-bold text-amber-400 block text-sm">الكيمياء</span>
                    <span class="text-[11px] text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('biology', 'العلوم الحياتية (علمي)')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition-all group shadow-sm">
                    <span class="text-2xl block mb-2 group-hover:scale-110 transition-transform">🧬</span>
                    <span class="font-bold text-amber-400 block text-sm">العلوم الحياتية</span>
                    <span class="text-[11px] text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('arabic', 'اللغة العربية (تخصص)')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition-all group shadow-sm">
                    <span class="text-2xl block mb-2 group-hover:scale-110 transition-transform">📚</span>
                    <span class="font-bold text-amber-400 block text-sm">العربية تخصص</span>
                    <span class="text-[11px] text-slate-400">الفرع الأدبي</span>
                </button>
                <button onclick="loadSubject('history', 'الدراسات التاريخية')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 p-4 rounded-2xl text-right transition-all group shadow-sm">
                    <span class="text-2xl block mb-2 group-hover:scale-110 transition-transform">🏛️</span>
                    <span class="font-bold text-amber-400 block text-sm">التاريخ</span>
                    <span class="text-[11px] text-slate-400">الفرع الأدبي</span>
                </button>
            </div>
        </section>

        <!-- صندوق الاختبار -->
        <section id="quiz-section" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <span id="quiz-subject-title" class="text-amber-400 font-bold text-sm">اسم المادة</span>
                <span id="question-counter" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-slate-300">السؤال 1 من أصل 0</span>
            </div>

            <!-- السؤال -->
            <div id="question-box" class="mb-5 text-base font-semibold leading-relaxed text-slate-100">
                جاري تحميل الأسئلة...
            </div>

            <!-- الخيارات -->
            <div id="options-box" class="space-y-2.5 mb-5"></div>

            <!-- التوضيح الوزاري -->
            <div id="explanation-box" class="hidden bg-slate-950 border border-slate-800 p-3.5 rounded-2xl text-xs mb-4 text-slate-300">
                <span class="font-bold text-amber-400 block mb-1">💡 التوضيح الوزاري:</span>
                <p id="explanation-text" class="leading-relaxed"></p>
            </div>

            <!-- أزرار التحكم -->
            <div class="flex justify-between items-center mt-4 pt-2 border-t border-slate-800/50">
                <button onclick="backToSubjects()" class="text-slate-400 hover:text-white text-xs font-bold px-3 py-2 transition-colors">
                    ← إرجاع للمواد
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-xs transition-all shadow-md">
                    السؤال التالي ←
                </button>
            </div>
        </section>

    </main>

    <!-- نافذة تفعيل VIP -->
    <div id="vip-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-amber-500/30 w-full max-w-sm p-6 rounded-3xl shadow-2xl">
            <h3 class="text-lg font-black text-amber-400 mb-1">تفعيل الباقة الكاملة (10 شيكل)</h3>
            <p class="text-xs text-slate-300 mb-4 leading-relaxed">أدخل كود التفعيل المرسل إليك بعد الدفع (عبر محفظتي أو Jawwal Pay):</p>
            <input type="text" id="vip-code-input" placeholder="مثال: GAZA10" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-center text-amber-400 font-bold tracking-widest mb-4 focus:outline-none focus:border-amber-500 text-sm">
            <div class="flex space-x-2 space-x-reverse">
                <button onclick="activateVip()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition">تفعيل الآن</button>
                <button onclick="closeVipModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl text-xs transition">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- جافاسكريبت وبنك الأسئلة المدمج لضمان العمل الفوري 100% -->
    <script>
        // قاعدة بيانات الأسئلة المدمجة بالكامل لتجنب أخطاء التحميل الخارجي
        const questionBanks = {
            physics: {
                subject: "الفيزياء - الفرع العلمي",
                questions: [
                    { q: "جسم كتلته 2kg أثّرت عليه قوة محصّلة مقدارها 8N، ما مقدار تسارعه؟", options: ["2 m/s²", "4 m/s²", "8 m/s²", "16 m/s²"], correct: 1, exp: "من قانون نيوتن الثاني: التسارع = القوة المحصلة ÷ الكتلة = 8 ÷ 2 = 4 م/ث²." },
                    { q: "ما وحدة قياس الدفع في النظام الدولي للوحدات؟", options: ["N.s", "Joule", "Watt", "kg.m"], correct: 0, exp: "الدفع يساوي التغير في الزخم الخطي، ووحدته نيوتن.ثانية (N.s)." },
                    { q: "في التصادم المرن تماماً، الكميات الفيزيائية المحفوظة هي:", options: ["السرعة فقط", "الطاقة الحركية والزخم الخطي معاً", "الطاقة الحركية وحدها", "طاقة الوضع فقط"], correct: 1, exp: "التصادم المرن يحفظ كلا من الزخم الخطي والطاقة الحركية الكلية للنظام." },
                    { q: "العوامل التي يعتمد عليها الزخم الخطي لجسم متحرك هي:", options: ["الكتلة والسرعة المتجهة", "القوة والزمن", "الكتلة والتسارع", "المسافة والزمن"], correct: 0, exp: "الزخم الخطي يعتمد طردياً على الكتلة والسرعة المتجهة." },
                    { q: "إذا تضاعفت سرعة جسم متحرك مع ثبات كتلته، فإن زخمه الخطي:", options: ["يقل للنصف", "يتضاعف مرتين", "يبقى ثابتاً", "يصبح ربعه"], correct: 1, exp: "العلاقة طردية خطية بين الزخم الخطي والسرعة عند ثبات الكتلة." },
                    { q: "اتجاه الدفع المؤثر على جسم يكون دائماً في اتجاه:", options: ["القوة المحصلة المؤثرة", "عكس اتجاه الحركة", "السرعة الابتدائية", "الجاذبية الأرضية"], correct: 0, exp: "الدفع كمية متجهة يتطابق اتجاهه تماماً مع اتجاه القوة المحصلة المؤثرة." },
                    { q: "معدل التغير الزمني للزخم الخطي لجسم يساوي:", options: ["الشغل المبذول", "القوة المحصلة", "الدفع الكلي", "الطاقة الحركية"], correct: 1, exp: "نص قانون نيوتن الثاني: القوة المحصلة تساوي معدل التغير الزمني في الزخم الخطي." },
                    { q: "وحدة قياس (kg.m/s) تكافئ وحدة:", options: ["N.s", "Joule", "Pascal", "Watt"], correct: 0, exp: "كيلوغرام.متر لكل ثانية مكافئة تماماً لنيوتن.ثانية." },
                    { q: "في التصادم عديم المرونة، تكون الطاقة الحركية بعد التصادم:", options: ["أكبر من قبل التصادم", "أقل من قبل التصادم", "مساوية تماماً", "تساوي صفراً"], correct: 1, exp: "يحدث فقد جزئي في الطاقة الحركية وتحولها لأشكال أخرى." },
                    { q: "المساحة تحت منحنى (القوة - الزمن) تمثل رياضياً:", options: ["الشغل", "الدفع", "التسارع", "القدرة"], correct: 1, exp: "المساحة المحصورة تحت منحنى القوة والزمن تعطي الدفع المؤثر." }
                ]
            },
            math_sci: {
                subject: "الرياضيات - الفرع العلمي",
                questions: [
                    { q: "ما مشتقة الاقتران ص = جتا(س)؟", options: ["جا(س)", "-جا(س)", "ظا(س)", "-جتا(س)"], correct: 1, exp: "مشتقة جيب التمام (جتا س) هي سالب الجيب (-جا س)." },
                    { q: "قيمة نهاية (س² - 4) ÷ (س - 2) عندما س تؤول إلى 2:", options: ["صفر", "2", "4", "غير متوفرة"], correct: 2, exp: "بتحليل البسط إلى (س-2)(س+2) واختصار المقام، ينتج التعويض بـ 2 + 2 = 4." },
                    { q: "مشتقة أي اقتران ثابت تساوي:", options: ["واحد", "صفر", "الاقتران نفسه", "ما لا نهاية"], correct: 1, exp: "مشتقة أي عدد ثابت تساوي صفراً دائماً." },
                    { q: "إذا كان ص = س³، فإن ص' تساوي:", options: ["3س", "3س²", "س²", "6س"], correct: 1, exp: "باستخدام قاعدة القوة: ننزل الأس ونطرح منه 1 فيصبح الناتج 3س²." },
                    { q: "ميل المماس لمنحنى الاقتران عند نقطة عليه يمثل:", options: ["المشتقة الأولى عند تلك النقطة", "التكامل المحدود", "نهاية الاقتران", "الصفر"], correct: 0, exp: "التفسير الهندسي للمشتقة الأولى هو ميل المماس للمنحنى." }
                ]
            },
            chemistry: {
                subject: "الكيمياء - الفرع العلمي",
                questions: [
                    { q: "[وزاري] المادة التي لها القدرة على منح بروتون لمادة أخرى حسب مفهوم برونستد-لوري تسمى:", options: ["حمض", "قاعدة", "ملح متعادل", "أكسيد فلزي"], correct: 0, exp: "الحمض حسب برونستد-لوري هو المادة مانحة البروتون (H+)." },
                    { q: "[وزاري] قيمة الرقم الهيدروجيني pH لمحلول حمض قوي تركيزه (0.01 M) تساوي:", options: ["2", "7", "12", "1"], correct: 0, exp: "تركيز أيون الهيدروجين يساوي تركيز الحمض (10^-2)، إذن pH = 2." }
                ]
            },
            biology: {
                subject: "العلوم الحياتية - الفرع العلمي",
                questions: [
                    { q: "[وزاري] العضية الخلوية المسؤولة عن إنتاج الطاقة (ATP) في الخلية الحية هي:", options: ["الميتوكندريا", "الريبوسومات", "جهاز غولجي", "البلاستيدات الخضراء"], correct: 0, exp: "الميتوكندريا تُعرف ببيت الطاقة في الخلية وتتم فيها عمليات التنفس الخلوي وإنتاج ATP." }
                ]
            },
            arabic: {
                subject: "اللغة العربية (تخصص) - الأدبي",
                questions: [
                    { q: "[وزاري] ما الفن الأدبي الذي يغلب عليه التعبير عن العواطف الذاتية والمشاعر الحزينة أو الحنين؟", options: ["المسرحية", "الرثاء", "المقالة", "القصة القصيرة"], correct: 1, exp: "الرثاء هو الفن الشعري المختص بتعداد محاسن الميت والتعبير عن لوعة الفراق والحزن." },
                    { q: "[وزاري] ما نوع الصورة البيانية في قول الشاعر (بكت السماء لفراقنا)؟", options: ["تشبيه بليغ", "استعارة مكنية", "استعارة تصريحية", "كنية"], correct: 1, exp: "شبه السماء بإنسان يبكي وحذف المشبه به، وهي استعارة مكنية." }
                ]
            },
            history: {
                subject: "الدراسات التاريخية - الأدبي",
                questions: [
                    { q: "[وزاري] الاتفاقية التي قسّمت مناطق الهلال الخصيب بين بريطانيا وفرنسا بعد الحرب العالمية الأولى هي:", options: ["سايكس بيكو", "بلفور", "سان ريمو", "لوزان"], correct: 0, exp: "اتفاقية سايكس بيكو السرية عام 1916 قسّمت مناطق النفوذ بين الدولتين." },
                    { q: "[وزاري] في أي عام صدر وعد بلفور المشئوم الذي أعطى حق لليهود في فلسطين؟", options: ["1917 م", "1920 م", "1948 م", "1936 م"], correct: 0, exp: "صدر وعد بلفور في الثاني من نوفمبر عام 1917 ميلادي." }
                ]
            }
        };

        let currentQuestions = [];
        let currentIndex = 0;
        let isVip = localStorage.getItem('tawjihi_vip') === 'true';

        function loadSubject(subjectKey, subjectName) {
            document.getElementById('subjects-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('quiz-subject-title').innerText = "بنك الوزارة: " + subjectName;

            if (questionBanks[subjectKey]) {
                currentQuestions = questionBanks[subjectKey].questions;
                currentIndex = 0;
                showQuestion();
            } else {
                document.getElementById('question-box').innerText = "عذراً، هذه المادة قيد التحديث وسيتم إطلاقها قريباً.";
            }
        }

        function showQuestion() {
            if (!isVip && currentIndex >= 10) {
                document.getElementById('quiz-section').innerHTML = `
                    <div class="text-center py-8">
                        <span class="text-3xl block mb-3">🔒</span>
                        <h3 class="text-base font-bold text-amber-400 mb-1">وصلت للحد المجاني (10 أسئلة)</h3>
                        <p class="text-xs text-slate-300 mb-5">لفتح كافة الأسئلة والحلول الوزارية، فعّل حسابك بـ 10 شيكل فقط!</p>
                        <button onclick="openVipModal()" class="bg-amber-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs shadow">أدخل كود التفعيل</button>
                        <br><br>
                        <button onclick="backToSubjects()" class="text-slate-400 text-xs underline">العودة للمواد</button>
                    </div>
                `;
                return;
            }

            if (currentIndex >= currentQuestions.length) {
                document.getElementById('quiz-section').innerHTML = `
                    <div class="text-center py-8">
                        <span class="text-3xl block mb-3">🎉</span>
                        <h3 class="text-base font-bold text-amber-400 mb-1">أحسنت! أنهيت الأسئلة المتوفرة</h3>
                        <p class="text-xs text-slate-300 mb-5">أنت جاهز للامتحان الوزاري بامتياز.</p>
                        <button onclick="backToSubjects()" class="bg-amber-500 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-xs shadow">اختر مادة أخرى</button>
                    </div>
                `;
                return;
            }

            let qData = currentQuestions[currentIndex];
            document.getElementById('question-counter').innerText = `السؤال ${currentIndex + 1} من أصل ${currentQuestions.length}`;
            document.getElementById('question-box').innerText = qData.q;
            
            let optionsHTML = "";
            qData.options.forEach((opt, idx) => {
                optionsHTML += `<button onclick="checkAnswer(${idx}, ${qData.correct})" class="option-btn w-full text-right bg-slate-950 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl transition text-slate-200 text-sm font-medium">${opt}</button>`;
            });
            document.getElementById('options-box').innerHTML = optionsHTML;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function checkAnswer(selected, correct) {
            let buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correct) {
                    btn.classList.remove('bg-slate-950', 'border-slate-800');
                    btn.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white');
                } else if (idx === selected) {
                    btn.classList.remove('bg-slate-950', 'border-slate-800');
                    btn.classList.add('bg-rose-600', 'border-rose-500', 'text-white');
                }
            });

            let qData = currentQuestions[currentIndex];
            if (qData.exp) {
                document.getElementById('explanation-text').innerText = qData.exp;
                document.getElementById('explanation-box').classList.remove('hidden');
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function backToSubjects() {
            location.reload();
        }

        function openVipModal() { document.getElementById('vip-modal').classList.remove('hidden'); }
        function closeVipModal() { document.getElementById('vip-modal').classList.add('hidden'); }

        function activateVip() {
            let code = document.getElementById('vip-code-input').value.trim();
            if (code === "GAZA10" || code.startsWith("GZ-")) {
                localStorage.setItem('tawjihi_vip', 'true');
                isVip = true;
                alert("مبروك! تم تفعيل الباقة الكاملة بنجاح 🎉");
                closeVipModal();
                location.reload();
            } else {
                alert("الكود غير صحيح، تأكد من الكود المدخل.");
            }
        }
    </script>
</body>
</html>
