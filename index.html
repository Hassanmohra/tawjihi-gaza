<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توجيهي بلس - فلسطين</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- شاشة الهيدر / العنوان -->
    <header class="bg-slate-800 border-b border-amber-500/30 p-4 sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-amber-500 text-slate-900 font-black p-2 rounded-xl text-xl shadow">🇹🇼</div>
                <div>
                    <h1 class="font-black text-xl text-amber-400">توجيهي بلس</h1>
                    <p class="text-xs text-slate-400">بنك أسئلة الوزارة - فلسطين</p>
                </div>
            </div>
            <button onclick="openVipModal()" class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-900 font-bold px-4 py-2 rounded-xl text-sm shadow hover:opacity-90 transition">
                ⭐ تفعيل الباقة الكاملة
            </button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto p-4 flex-grow max-w-2xl">
        
        <!-- قسم اختيار المواد -->
        <section id="subjects-section" class="mb-6">
            <h2 class="text-lg font-bold mb-3 text-slate-200 border-r-4 border-amber-500 pr-2">اختر المادة الدراسية:</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="loadSubject('physics', 'الفيزياء (علمي)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-right transition shadow">
                    <span class="text-2xl block mb-1">⚡</span>
                    <span class="font-bold text-amber-400 block">الفيزياء</span>
                    <span class="text-xs text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('math_sci', 'الرياضيات (علمي)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-right transition shadow">
                    <span class="text-2xl block mb-1">📐</span>
                    <span class="font-bold text-amber-400 block">الرياضيات</span>
                    <span class="text-xs text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('chemistry', 'الكيمياء (علمي)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-right transition shadow">
                    <span class="text-2xl block mb-1">🧪</span>
                    <span class="font-bold text-amber-400 block">الكيمياء</span>
                    <span class="text-xs text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('biology', 'العلوم الحياتية (علمي)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-right transition shadow">
                    <span class="text-2xl block mb-1">🧬</span>
                    <span class="font-bold text-amber-400 block">العلوم الحياتية</span>
                    <span class="text-xs text-slate-400">الفرع العلمي</span>
                </button>
                <button onclick="loadSubject('arabic', 'اللغة العربية (تخصص)')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-right transition shadow">
                    <span class="text-2xl block mb-1">📚</span>
                    <span class="font-bold text-amber-400 block">العربية تخصص</span>
                    <span class="text-xs text-slate-400">الفرع الأدبي</span>
                </button>
                <button onclick="loadSubject('history', 'الدراسات التاريخية')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-2xl text-right transition shadow">
                    <span class="text-2xl block mb-1">🏛️</span>
                    <span class="font-bold text-amber-400 block">التاريخ</span>
                    <span class="text-xs text-slate-400">الفرع الأدبي</span>
                </button>
            </div>
        </section>

        <!-- صندوق الاختبار (يظهر عند اختيار المادة) -->
        <section id="quiz-section" class="hidden bg-slate-800 border border-slate-700 rounded-3xl p-5 shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <span id="quiz-subject-title" class="text-amber-400 font-bold">اسم المادة</span>
                <span id="question-counter" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">السؤال 1 من أصل 0</span>
            </div>

            <!-- السؤال -->
            <div id="question-box" class="mb-5 text-lg font-semibold leading-relaxed text-slate-100">
                جاري تحميل الأسئلة...
            </div>

            <!-- الخيارات -->
            <div id="options-box" class="space-y-3 mb-5">
                <!-- يتم تعبئتها برمجياً -->
            </div>

            <!-- الشرح وزر التقرير -->
            <div id="explanation-box" class="hidden bg-slate-900/80 border border-slate-700 p-3 rounded-xl text-sm mb-4 text-slate-300">
                <span class="font-bold text-amber-400 block mb-1">💡 التوضيح الوزاري:</span>
                <p id="explanation-text"></p>
            </div>

            <!-- أزرار التحكم -->
            <div class="flex justify-between items-center mt-4">
                <button onclick="backToSubjects()" class="text-slate-400 hover:text-white text-sm font-bold px-3 py-2">
                    ← إرجاع للمواد
                </button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-6 py-2 rounded-xl transition shadow">
                    السؤال التالي ←
                </button>
            </div>
        </section>

    </main>

    <!-- نافذة إدخال كود التفعيل (10 شيكل) -->
    <div id="vip-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-amber-500/30 w-full max-w-md p-6 rounded-3xl shadow-2xl">
            <h3 class="text-xl font-black text-amber-400 mb-2">تفعيل حساب VIP (10 شيكل)</h3>
            <p class="text-sm text-slate-300 mb-4">أدخل كود التفعيل المرسل إليك بعد الدفع عبر (محفظتي أو Jawwal Pay) لفتح كافة الأسئلة بلا حدود:</p>
            <input type="text" id="vip-code-input" placeholder="أدخل الكود هنا (مثال: GAZA10)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-amber-400 font-bold tracking-widest mb-4 focus:outline-none focus:border-amber-500">
            <div class="flex space-x-2 space-x-reverse">
                <button onclick="activateVip()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl transition">تفعيل الآن</button>
                <button onclick="closeVipModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-3 rounded-xl transition">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- جافاسكريبت التشغيل وجلب ملفات الـ JSON -->
    <script>
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let isVip = localStorage.getItem('tawjihi_vip') === 'true';

        async function loadSubject(subjectKey, subjectName) {
            document.getElementById('subjects-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('quiz-subject-title').innerText = "بنك الوزارة: " + subjectName;
            document.getElementById('question-box').innerText = "جاري تحميل الأسئلة من الأرشيف...";
            document.getElementById('options-box').innerHTML = "";
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            try {
                // جلب الملف من مجلد data/ برابط مباشر وصحيح
                let response = await fetch(`data/${subjectKey}.json`);
                if (!response.ok) throw new Error("تعذر جلب ملف المادة");
                
                let data = await response.json();
                currentQuestions = data.questions;
                currentIndex = 0;
                score = 0;

                showQuestion();
            } catch (error) {
                console.error(error);
                document.getElementById('question-box').innerText = "عذراً، حدث خطأ في تحميل الأسئلة. تأكد من وجود ملف المادة في مجلد data.";
            }
        }

        function showQuestion() {
            // نظام Freemium: أول 10 أسئلة مجانية، وما بعده يتطلب VIP
            if (!isVip && currentIndex >= 10) {
                document.getElementById('quiz-section').innerHTML = `
                    <div class="text-center py-8">
                        <span class="text-4xl block mb-3">🔒</span>
                        <h3 class="text-xl font-bold text-amber-400 mb-2">وصلت للحد المجاني (10 أسئلة)</h3>
                        <p class="text-sm text-slate-300 mb-5">لفتح المئات من الأسئلة والحلول الوزارية كاملة، فعّل حسابك بـ 10 شيكل فقط عبر الكود!</p>
                        <button onclick="openVipModal()" class="bg-amber-500 text-slate-900 font-bold px-6 py-3 rounded-xl shadow">أدخل كود التفعيل الآن</button>
                        <br><br>
                        <button onclick="backToSubjects()" class="text-slate-400 text-sm underline">العودة للمواد</button>
                    </div>
                `;
                return;
            }

            if (currentIndex >= currentQuestions.length) {
                document.getElementById('quiz-section').innerHTML = `
                    <div class="text-center py-8">
                        <span class="text-4xl block mb-3">🎉</span>
                        <h3 class="text-xl font-bold text-amber-400 mb-2">أحسنت! أتممت كافة الأسئلة المتوفرة</h3>
                        <p class="text-sm text-slate-300 mb-5">أنت بطل جاهز للامتحان الوزاري بامتياز.</p>
                        <button onclick="backToSubjects()" class="bg-amber-500 text-slate-900 font-bold px-6 py-3 rounded-xl shadow">اختر مادة أخرى</button>
                    </div>
                `;
                return;
            }

            let qData = currentQuestions[currentIndex];
            document.getElementById('question-counter').innerText = `السؤال ${currentIndex + 1} من أصل ${currentQuestions.length}`;
            document.getElementById('question-box').innerText = qData.q;
            
            let optionsHTML = "";
            qData.options.forEach((opt, idx) => {
                optionsHTML += `<button onclick="checkAnswer(${idx}, ${qData.correct})" class="option-btn w-full text-right bg-slate-700 hover:bg-slate-600 border border-slate-600 p-3 rounded-xl transition text-slate-100 font-medium">${opt}</button>`;
            });
            document.getElementById('options-box').innerHTML = optionsHTML;
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
        }

        function checkAnswer(selected, correct) {
            let buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correct) {
                    btn.classList.remove('bg-slate-700', 'border-slate-600');
                    btn.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white');
                } else if (idx === selected) {
                    btn.classList.remove('bg-slate-700', 'border-slate-600');
                    btn.classList.add('bg-rose-600', 'border-rose-500', 'text-white');
                }
            });

            let qData = currentQuestions[currentIndex];
            if (qData.exp) {
                document.getElementById('explanation-text').innerText = qData.exp;
                document.getElementById('explanation-box').classList.remove('hidden');
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            showQuestion();
        }

        function backToSubjects() {
            location.reload();
        }

        function openVipModal() { document.getElementById('vip-modal').classList.remove('hidden'); }
        function closeVipModal() { document.getElementById('vip-modal').classList.add('hidden'); }

        function activateVip() {
            let code = document.getElementById('vip-code-input').value.trim();
            // الأكواد المعتمدة للتفعيل التجريبي أو الحقيقي
            if (code === "GAZA10" || code.startsWith("GZ-")) {
                localStorage.setItem('tawjihi_vip', 'true');
                isVip = true;
                alert("مبروك! تم تفعيل الباقة الكاملة بنجاح 🎉");
                closeVipModal();
                location.reload();
            } else {
                alert("الكود غير صحيح، تأكد من الرقم المدخل أو تواصل معنا للحصول على كودك الخاص.");
            }
        }
    </script>
</body>
</html>
